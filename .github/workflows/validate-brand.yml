{
  "name": "Validate approved brand foundation",
  "on": {
    "push": {
      "branches": [
        "validate/572-approved-brand"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "brand": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "env": {
        "NEXT_PUBLIC_CHAIN_ID": "11155420",
        "NEXT_PUBLIC_RPC_URL": "https://sepolia.optimism.io",
        "NEXT_PUBLIC_API_BASE_URL": "https://validation.invalid",
        "NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID": "00000000000000000000000000000000",
        "NEXT_PUBLIC_EXPLORER_BASE_URL": "https://sepolia-optimism.etherscan.io"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Install without lifecycle scripts",
          "run": "corepack enable pnpm\npnpm install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "Scoped brand lint",
          "run": "pnpm exec eslint src/components/brand src/lib/brand-assets.ts src/lib/brand-tokens.ts src/__tests__/design-system/brand-assets.test.tsx"
        },
        {
          "name": "Scoped brand types",
          "if": "always()",
          "run": "pnpm exec tsc -p .review/tsconfig.brand.json"
        },
        {
          "name": "Scoped brand and semantic contract tests",
          "if": "always()",
          "run": "pnpm exec jest --config .review/jest.brand.cjs --runInBand"
        },
        {
          "name": "Brand Storybook build",
          "if": "always()",
          "run": "pnpm exec storybook build --config-dir .storybook/brand --output-dir storybook-brand"
        },
        {
          "name": "Install Chromium",
          "if": "always()",
          "run": "pnpm exec playwright install --with-deps chromium"
        },
        {
          "name": "Brand Storybook interactions and accessibility",
          "if": "always()",
          "run": "pnpm exec vitest run --config .storybook/brand/vitest.config.ts"
        },
        {
          "name": "Brand visual, contrast and keyboard checks",
          "if": "always()",
          "run": "node .review/capture-brand.mjs"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "brand-572-visual-evidence",
            "path": "screenshots/",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
